name: Update and deploy global risk radar
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Capture immutable forward risk research snapshots"]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
concurrency:
  group: global-risk-radar
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run quality regression tests
        run: python -m unittest discover -s tests -v
      - name: Collect risk indicators and evaluate alerts
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/collect.py
      - name: Capture missing same-day forward snapshot after 20:00 Taipei
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/forward_health.py --capture-if-due
      - name: Record validated historical observations
        run: python scripts/history.py
      - name: Validate data quality before risk scoring
        run: python scripts/quality.py
      - name: Replay every historical PIT vintage selection
        run: python scripts/audit_pit_full_replay.py
      - name: Calibrate frozen six-factor PIT research model
        run: python scripts/calibration.py
      - name: Run no-lookahead historical threshold diagnostics
        run: python scripts/backtest.py
      - name: Generate separate provisional risk scores
        run: python scripts/scores.py
      - name: Persist state for next scheduled run
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data.json docs/history/observations.json docs/quality.json docs/calibration.json docs/backtest.json docs/scores.json docs/risk_dashboard.json docs/model_readiness.json docs/pit_full_replay_audit.json storage/history.sqlite docs/forward_health.json docs/phase5_forward_capture_latest.json docs/phase5_forward_status.json
          if test -d storage/prospective; then git add storage/prospective; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update radar snapshot [skip ci]'
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase -X ours origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            echo 'Failed to persist snapshot after retries' >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
