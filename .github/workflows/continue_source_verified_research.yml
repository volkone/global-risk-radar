name: Continue research without purchasing one-day TXF extract
on:
  push:
    paths:
      - '.github/workflows/continue_source_verified_research.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute fixed-method source-verified research backtest
        run: python scripts/run_qualified_source_limited_backtest.py
      - name: Recheck formal production quality gate
        run: python scripts/recheck_p204_gate.py
      - name: Commit research and gate reports
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/qualified_source_limited_backtest.json docs/p2_04_gate_recheck.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record official-daily-source research and unchanged production gate [skip ci]'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
