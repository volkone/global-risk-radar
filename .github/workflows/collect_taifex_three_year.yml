name: Collect TAIFEX official three-year TXF foreign OI
on:
  push:
    paths:
      - '.github/workflows/collect_taifex_three_year.yml'
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      offset:
        description: 'Reference offset; -1 resumes automatically and retries remaining gaps'
        required: false
        default: '-1'
      limit:
        description: 'Maximum dates per run (1..30)'
        required: false
        default: '20'
permissions:
  contents: write
  actions: write
concurrency:
  group: taifex-three-year-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify regression tests
        run: python -m unittest discover -s tests -v
      - name: Collect bounded TXF foreign OI batch with per-date checkpoints
        env:
          BATCH_OFFSET: ${{ inputs.offset || '-1' }}
          BATCH_LIMIT: ${{ inputs.limit || '20' }}
        run: python scripts/collect_taifex_three_year.py --offset "$BATCH_OFFSET" --limit "$BATCH_LIMIT"
      - name: Audit completeness and source identity (expected blocked until full calendar)
        id: audit
        continue-on-error: true
        run: python scripts/audit_taifex_coverage.py
      - name: Save official observations and diagnostics even if audit blocked
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for path in storage/taifex_backfill.json docs/taifex_collection_report.json docs/taifex_coverage_audit.json; do
            if [ -f "$path" ]; then git add "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Checkpoint TAIFEX TXF OI batch and diagnostics [skip ci]'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Queue next batch without relying on delayed cron
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          report = json.loads(Path('docs/taifex_collection_report.json').read_text(encoding='utf-8'))
          missing = len(report['missing_reference_dates'])
          offset = int(report['last_batch_offset'])
          size = int(report['last_batch_size'])
          total = int(report['twse_reference_sessions'])
          added = int(report['last_batch_new_rows'])
          if not missing:
              print('All reference dates collected. Stopping chain.')
          elif offset >= total and added == 0:
              print('Remaining gaps did not yield official data. Stop chain; retain diagnostics.')
          else:
              url = 'https://api.github.com/repos/' + os.environ['GH_REPOSITORY'] + '/actions/workflows/collect_taifex_three_year.yml/dispatches'
              payload = json.dumps({'ref': 'main', 'inputs': {'offset': '-1', 'limit': '20'}}).encode()
              req = urllib.request.Request(url, data=payload, method='POST', headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=15) as response:
                  print('Queued next batch:', response.status, 'missing:', missing)
          PY
      - name: Explain model readiness without marking collection as failed
        if: always()
        run: |
          echo 'Batch completion is independent of the full TAIFEX quality gate.'
          echo 'Full model backtesting remains blocked until all historical/calendar checks pass.'
