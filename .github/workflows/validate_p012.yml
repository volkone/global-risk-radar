name: Validate P0 P1 P2 readiness report
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate_p012.yml'
permissions:
  contents: write
concurrency:
  group: p012-readiness-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run P0 P1 P2 unit tests
        run: python -m unittest discover -s tests -p 'test_p012_readiness.py' -v
      - name: Generate P0 P1 P2 diagnostic report
        run: python scripts/audit_p012_readiness.py
      - name: Verify report schema and fail-closed authorization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("docs/p012_readiness.json").read_text(encoding="utf-8"))
          assert all(k in report for k in ("p0","p1","p2"))
          assert report["formal_backtest_authorized"] is False
          assert all(isinstance(report[k]["complete"],bool) for k in ("p0","p1","p2"))
          print("P0/P1/P2 report verified", {k:report[k]["complete"] for k in ("p0","p1","p2")})
          PY
      - name: Commit report if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/p012_readiness.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record P0 P1 P2 readiness [skip ci]'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: p012-readiness-report
          path: docs/p012_readiness.json
