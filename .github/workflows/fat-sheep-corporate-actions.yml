name: Fat Sheep - corporate action evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fat-sheep-corporate-actions.yml'
permissions:
  contents: read
concurrency:
  group: fat-sheep-corporate-actions
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect evidence
        run: python -u scripts/fat_sheep_actions_collect.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fat-sheep-corporate-action-evidence
          path: data/fat_sheep/corporate_actions/
          retention-days: 30
