name: Independently recheck TAIFEX source hashes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify_raw_sources.yml']
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum raw source downloads per run (1-30)'
        required: false
        default: '30'
permissions:
  contents: write
  actions: write
concurrency:
  group: taifex-independent-source-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independently download and hash-check bounded source batch
        env:
          LIMIT: ${{ inputs.limit || '20' }}
        run: python scripts/refetch_taifex_hashes.py --limit "$LIMIT"
      - name: Save verification ledger and summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add storage/verification/taifex_sha256_recheck.json docs/taifex_raw_hash_recheck.json
          if ! git diff --cached --quiet; then
            git commit -m 'Checkpoint independent TAIFEX source verification [skip ci]'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Continue next bounded batch until all 718 dates attempted
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          state=json.loads(Path("storage/verification/taifex_sha256_recheck.json").read_text())
          total=len(json.loads(Path("storage/taifex_backfill.json").read_text())["records"])
          done=state["records"]
          finished=sum(v.get("status") in ("match","mismatch","content_mismatch","unparseable") or (v.get("status")=="fetch_error" and v.get("attempts",0)>=2) for v in done.values())
          print("Completed:",finished,"of",total)
          if finished>=total:
              print("All records attempted; inspect mismatch and fetch-error counts")
          else:
              url="https://api.github.com/repos/"+os.environ["GH_REPOSITORY"]+"/actions/workflows/verify_raw_sources.yml/dispatches"
              payload=json.dumps({"ref":"main","inputs":{"limit":"30"}}).encode()
              req=urllib.request.Request(url,data=payload,method="POST",headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"})
              with urllib.request.urlopen(req,timeout=20) as res: print("Queued next batch:",res.status)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: taifex-raw-source-hash-audit
          path: docs/taifex_raw_hash_recheck.json
