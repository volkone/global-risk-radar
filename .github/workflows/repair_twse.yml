name: TWSE targeted historical repair
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: twse-history-backfill
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data-quality-gate-20261111
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Retry only two known historical gaps
        run: python -m scripts.repair_twse_dates --execute
      - name: Re-audit TWSE observations
        run: python scripts/audit_backfill.py
      - name: Commit verified repairs and audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add storage/twse_backfill.json docs/backfill_audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'Audit and repair targeted TWSE dates [skip ci]'
            git push origin HEAD:data-quality-gate-20261111
          fi
