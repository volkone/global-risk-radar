name: Audit TAIFEX calendar and evidence gate
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: taifex-calendar-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit calendar dates
        run: python scripts/audit_taifex_calendar.py
      - name: Verify official evidence URL integrity
        continue-on-error: true
        run: python scripts/verify_taifex_evidence_urls.py
      - name: Discover TAIFEX official closure notices
        continue-on-error: true
        run: python scripts/scan_taifex_notice_archive.py
      - name: Check pre-backtest gate (fail closed)
        run: python scripts/check_taifex_evidence.py
      - name: Save audit reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/taifex_calendar_audit.json docs/taifex_prebacktest_gate.json
          if test -f docs/taifex_evidence_url_check.json; then git add docs/taifex_evidence_url_check.json; fi
          if test -f docs/taifex_notice_archive_scan.json; then git add docs/taifex_notice_archive_scan.json; fi
          if git diff --cached --quiet; then
            echo 'Audit reports unchanged'
          else
            git commit -m 'Checkpoint TAIFEX calendar audit and quality gate [skip ci]'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
