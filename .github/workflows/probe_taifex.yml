name: Probe official TAIFEX historical download
on:
  push:
    paths:
      - '.github/workflows/probe_taifex.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect official TAIFEX form and save diagnostic
        run: python scripts/probe_taifex_download.py
      - name: Persist official form inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/taifex_download_probe.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record TAIFEX official form inspection [skip ci]'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
