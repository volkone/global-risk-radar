name: Validate historical data gate
on:
  pull_request:
    paths:
      - 'scripts/audit_calendar.py'
      - 'scripts/repair_twse_dates.py'
      - 'tests/test_audit_calendar.py'
      - 'tests/test_repair_twse_dates.py'
      - '.github/workflows/validate_history_gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile changed scripts
        run: python -m py_compile scripts/audit_calendar.py scripts/repair_twse_dates.py
      - name: Run full offline test suite
        run: python -m unittest discover -s tests -v
