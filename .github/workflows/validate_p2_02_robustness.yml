name: P2-02 robustness and factor ablation
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/validate_p2_02_robustness.yml'
permissions:
  contents: write
jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile scripts/validate_p2_02_robustness.py
      - run: python scripts/validate_p2_02_robustness.py
      - name: Check robustness output
        run: |
          python - <<'PY'
          import json
          j=json.load(open('docs/p2_02_robustness.json',encoding='utf-8'))
          assert j['status']=='descriptive_robustness_completed'
          assert j['full_model_validated'] is False and j['recommended_live_threshold'] is None
          for h,v in j['holdout'].items():
            assert len(v['leave_one_factor_out'])==6
            assert sum(x['n'] for x in v['temporal_halves'].values())==v['overall']['n']
            assert sum(x['n'] for x in v['past_only_trend_regimes'].values())==v['overall']['n']
            assert all(x['without_factor']['n']==v['overall']['n'] for x in v['leave_one_factor_out'].values())
            print(h,'checks passed')
          PY
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/p2_02_robustness.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save P2-02 robustness and factor ablation report [skip ci]'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
