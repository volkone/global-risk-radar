name: Verify TAIFEX announcement year selector
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify_taifex_announcement_years.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile both diagnostic scripts
        run: python -m py_compile scripts/probe_taifex_announcement_years.py scripts/diagnose_taifex_hisnews.py
      - name: Probe official year selection and positive control
        run: python scripts/probe_taifex_announcement_years.py
      - name: Validate output and preserve conservative gate
        run: |
          python - <<'PY'
          import json
          p='docs/taifex_announcement_year_probe.json'
          j=json.load(open(p,encoding='utf-8'))
          assert j['base']['status']==200
          assert j['base']['link_count']>0, 'Official announcement listing must contain actual notice links'
          assert j['known_notice_2026_10_22_found'], 'Known October 2026 closure notice not found'
          assert j['verified_archive_complete'] is False
          print('Year selector working:',j['selector_working'])
          print('Year query diagnostics:',[(x['year'],x['year_match'],x['result']['link_count']) for x in j['year_queries']])
          PY
      - name: Commit evidence
        if: always()
        run: |
          if [ -f docs/taifex_announcement_year_probe.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/taifex_announcement_year_probe.json
            if ! git diff --cached --quiet; then
              git commit -m 'Record official TAIFEX year selector verification [skip ci]'
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
          fi
