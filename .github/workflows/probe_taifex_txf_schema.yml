name: Inspect verified TXF foreign OI table
on:
  push:
    paths:
      - '.github/workflows/probe_taifex_txf_schema.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/probe_taifex_txf_schema.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/taifex_txf_table_schema.json
          if ! git diff --cached --quiet; then
            git commit -m 'Verify TXF institutional table schema [skip ci]'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
