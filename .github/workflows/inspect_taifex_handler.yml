name: Inspect TAIFEX download button handler
on:
  push:
    paths:
      - '.github/workflows/inspect_taifex_handler.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/inspect_taifex_handler.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/taifex_download_handler_inspection.json
          if ! git diff --cached --quiet; then
            git commit -m 'Inspect TAIFEX download handler [skip ci]'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
