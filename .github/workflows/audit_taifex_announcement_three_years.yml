name: Audit TAIFEX 3-year announcements and calendar
# Re-run after date parser fix and inspect pagination metadata
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit_taifex_announcement_three_years.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check collector syntax
        run: python -m py_compile scripts/audit_taifex_announcement_three_years.py
      - name: Collect 2023-2026 official year-filtered announcements
        run: python scripts/audit_taifex_announcement_three_years.py
      - name: Verify evidence and maintain backtest gate
        run: |
          python - <<'PY'
          import json
          j=json.load(open('docs/taifex_announcement_three_year_audit.json',encoding='utf-8'))
          assert len(j['years'])==4
          assert len(j['special_date_reconciliation'])>=1
          assert j['full_notice_sweep_verified'] is False
          assert j['full_model_backtest_authorized'] is False
          print('Year filters:',[(y['year'],y['verified_year_filter'],y['record_count']) for y in j['years']])
          print('Matched calendar evidence:',sum(x['matched'] for x in j['special_date_reconciliation']),'/',len(j['special_date_reconciliation']))
          print('Unresolved:',j['blockers'])
          PY
      - name: Commit audit report
        if: always()
        run: |
          if [ -f docs/taifex_announcement_three_year_audit.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/taifex_announcement_three_year_audit.json
            if ! git diff --cached --quiet; then
              git commit -m 'Save three-year TAIFEX announcement calendar reconciliation [skip ci]'
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
          fi
